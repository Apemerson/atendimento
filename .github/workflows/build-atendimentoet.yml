name: Build atendimentoET image

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - app/controllers/kanban/provider_webhooks_controller.rb
      - .github/workflows/build-atendimentoet.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - app/controllers/kanban/provider_webhooks_controller.rb
      - .github/workflows/build-atendimentoet.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Ruby syntax against the pinned base image
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            --entrypoint ruby \
            ghcr.io/apemerson/atendimentoet:v4.18.0-0.0.5 \
            -c app/controllers/kanban/provider_webhooks_controller.rb

      - name: Build and push overlay image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
          tags: ghcr.io/apemerson/atendimentoet:v4.18.0-0.0.7
