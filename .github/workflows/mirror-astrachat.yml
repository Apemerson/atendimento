name: Mirror AstraChat image to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull AstraChat image
        run: docker pull astraonline/astrachat:v4.15.1-0.0.1

      - name: Tag image for this account
        run: docker tag astraonline/astrachat:v4.15.1-0.0.1 ghcr.io/apemerson/astrachat:v4.15.1-0.0.1

      - name: Push owned mirror
        run: docker push ghcr.io/apemerson/astrachat:v4.15.1-0.0.1
