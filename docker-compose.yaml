version: '3.8'


services:
  chatwoot:
    image: ghcr.io/apemerson/atendimentoet:v4.18.0-0.0.5
    entrypoint: docker/entrypoints/rails.sh
    command: >
      sh -c "echo \"Rails.application.config.after_initialize do; ChatwootHub.module_eval do; def self.pricing_plan; 'enterprise'; end; def self.pricing_plan_quantity; 9999999; end; end; end\" > /app/config/initializers/enterprise_override.rb && 
      echo \"begin; 
      ChatwootHub.module_eval { def self.pricing_plan; 'enterprise'; end; def self.pricing_plan_quantity; 9999999; end }; 
      config = InstallationConfig.find_or_initialize_by(name: 'INSTALLATION_PRICING_PLAN'); 
      config.value = 'enterprise'; 
      config.save!; 
      config_qty = InstallationConfig.find_or_initialize_by(name: 'INSTALLATION_PRICING_PLAN_QUANTITY'); 
      config_qty.value = '9999999'; 
      config_qty.save!; 
      rescue => e; puts e.message; end\" | bundle exec rails runner - && 
      echo 'Rails.application.config.active_storage.variant_processor = :mini_magick' > /app/config/initializers/active_storage.rb && 
      bundle exec rails db:chatwoot_prepare && 
      bundle exec rails s -p 3000 -b 0.0.0.0"
    environment: &chatwoot-env
      TZ: America/Sao_Paulo
      CHATWOOT_HUB_URL: https://astraonline.com.br
      INSTALLATION_NAME: atendimentoET
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
      SECRET_KEY_BASE: ${SERVICE_REALBASE64_64_CHATWOOT}
      FRONTEND_URL: https://connect.emersontorres.com.br
      DEFAULT_LOCALE: pt_BR
      FORCE_SSL: "true"
      ENABLE_ACCOUNT_SIGNUP: "false"
      REDIS_URL: redis://redis:6379
      POSTGRES_HOST: postgres
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_DB}
